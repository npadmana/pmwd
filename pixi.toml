[workspace]
authors = ["Nikhil Padmanabhan <nikhil.padmanabhan@gmail.com>"]
channels = ["conda-forge"]
name = "pmwd"
platforms = ["linux-64"]
version = "0.1.0"

[tasks]

[dependencies]
python = "3.10.*"
numpy = ">=2.2.6,<3"
scipy = ">=1.15.2,<2"
matplotlib = ">=3.10.3,<4"
ipykernel = ">=6.29.5,<7"

[pypi-dependencies]
jax = { version = ">=0.6.2, <0.7", extras = ["cuda"] }
pmwd = { path = ".", editable = true}
mcfit = ">=0.0.22, <0.0.23"
